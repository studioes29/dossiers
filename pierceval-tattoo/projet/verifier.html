<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Vérifier une carte cadeau</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--ink:#1c0f1f;--plum:#351d3a;--pink:#e68dca;--text:#f5eef1;--muted:#b9a5bb;--ok:#95d8a9;--warn:#f0c46e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font-family:Rubik,system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:440px;display:grid;gap:18px}
h1{font-size:2rem;letter-spacing:-.03em;margin:0}h1 em{font-family:"Instrument Serif",serif;font-weight:400;color:var(--pink)}
label{font-size:.9rem;color:var(--muted)}input{width:100%;font:inherit;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--text);border:0;border-bottom:1.5px solid var(--muted);padding:10px 0;outline:none}input:focus{border-color:var(--pink)}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:14px 22px;background:var(--pink);color:var(--ink);cursor:pointer}
.card{background:var(--plum);border-radius:8px;padding:20px;display:grid;gap:6px}.card b{font-size:1.4rem}.ok{color:var(--ok)}.ko{color:var(--warn)}.muted{color:var(--muted);font-size:.9rem}
</style></head><body><main>
<h1>Vérifier une <em>carte cadeau</em></h1>
<form id="f"><label for="c">Numéro de la carte</label><input id="c" placeholder="PT-XXXX-XXXX" autocomplete="off"><p></p><button>Vérifier</button></form>
<div id="out"></div>
</main><script>
/* Démonstration hors ligne : sur piercevaltattoo.fr, la page lit les vrais paiements. */
if(!/piercevaltattoo\.fr$|netlify\.app$/.test(location.hostname)){(function(){
 const K='pt-demo-used',get=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}},put=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};
 const ok=c=>/^PT-[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$/.test(c);
 const J=o=>Promise.resolve(new Response(JSON.stringify(o),{headers:{'Content-Type':'application/json'}}));
 window.fetch=function(u,o){u=String(u);if(u.indexOf('gift-check')<0)return Promise.reject(new Error('demo'));
  if(o&&o.method==='POST'){const b=JSON.parse(o.body||'{}');if(!b.pin)return J({ok:false});const g=get();g[b.code]=new Date().toLocaleDateString('fr-FR');put(g);return J({ok:true})}
  const c=decodeURIComponent((u.split('code=')[1]||'')).toUpperCase();if(!ok(c))return J({found:false});
  return J({found:true,paid:true,used:get()[c]||null,amount:50,pour:'Louise',date:Math.floor(Date.now()/1000)-86400*3})};
 document.addEventListener('DOMContentLoaded',()=>{const p=document.createElement('p');p.style.cssText='margin:0;font-size:.85rem;color:#b9a5bb';p.textContent='Démonstration : essayez PT-7KQ3-M9XD, et n\'importe quel code du studio. Une fois le site en ligne, cette page lit les vrais paiements.';document.querySelector('main').appendChild(p)});
})()}
</script>
<script>
const $=s=>document.querySelector(s),out=$('#out');
$('#f').onsubmit=async e=>{e.preventDefault();const code=$('#c').value.trim().toUpperCase();out.innerHTML='<p class="muted">Recherche…</p>';
 try{const r=await fetch('/.netlify/functions/gift-check?code='+encodeURIComponent(code));const v=await r.json();
  if(!v.found){out.innerHTML='<div class="card"><b class="ko">Numéro introuvable</b><span class="muted">Aucun paiement ne correspond à ce numéro.</span></div>';return}
  const d=new Date(v.date*1000).toLocaleDateString('fr-FR');
  out.innerHTML=`<div class="card"><b class="${v.paid&&!v.used?'ok':'ko'}">${!v.paid?'Paiement non abouti':v.used?'Déjà utilisée le '+v.used:'Carte valable'}</b><span>${v.amount} € · pour ${v.pour||'?'}</span><span class="muted">Payée le ${d}</span>${v.paid&&!v.used?'<button id="use" style="margin-top:10px">Marquer comme utilisée</button>':''}</div>`;
  const u=$('#use');if(u)u.onclick=async()=>{const p=document.createElement('input');p.type='password';p.placeholder='Code du studio';u.replaceWith(p);const b=document.createElement('button');b.textContent='Confirmer';p.after(b);b.onclick=async()=>{const r=await fetch('/.netlify/functions/gift-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,pin:p.value})});const j=await r.json();out.insertAdjacentHTML('beforeend',j.ok?'<p class="ok">Carte marquée comme utilisée.</p>':'<p class="ko">Code du studio incorrect.</p>')}}
 }catch(err){out.innerHTML='<p class="ko">Vérification impossible pour le moment.</p>'}};
</script></body></html>
