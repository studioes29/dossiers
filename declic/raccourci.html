<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#191919">
<meta name="apple-mobile-web-app-title" content="Déclic">
<title>Déclic</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone.svg">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#191919;color:#E1DBC4;font:17px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;padding:0 16px;box-sizing:border-box}
main{max-width:340px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:24px;margin:18px 0 8px}
b{color:#F6D24A}
p{margin:0 0 12px}
</style>
</head>
<body>
<main>
<img src="apple-touch-icon.png" alt="">
<h1>Déclic</h1>
<p id="txt">Ouverture…</p>
</main>
<script>
(function(){
  var id = (location.hash || "").replace(/[^A-Za-z0-9_-]/g, "");
  var cible = id ? "https://claude.ai/artifact/" + id : "";
  if(cible && /[?&]go\b/.test(location.search)){ location.replace(cible); return; }
  if(cible) history.replaceState(null, "", location.pathname + "?go#" + id);
  document.getElementById("txt").innerHTML = cible
    ? "Dans Safari, touchez <b>Partager</b>, puis <b>Sur l’écran d’accueil</b>.<br>L’icône ouvrira directement la page."
    : "Lien incomplet.";
})();
</script>
</body>
</html>
