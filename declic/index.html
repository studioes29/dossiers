// Après le déclic, la photo devient un tirage posé au-dessus du verdict.
const dev = document.createElement('canvas');

  if (dev.width !== w || dev.height !== h) { dev.width = w; dev.height = h; }

function redraw() {
  if (state === 'intro') { ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); home.draw(ctx, time); }

}

/* ---------- Déroulé : chaque écran attend un appui ---------- */
const TAG_WORDS = [['le bouquet', '#B9A2F5'], ['le saut', '#FF9CC8'], ['le ruban', '#F6D24A']]; let tagI = -1;
function setBars() { bars.hidden = state === 'intro' || state === 'end'; [...bars.children].forEach((b, i) => b.classList.toggle('on', i < idx || (i === idx && state === 'shot'))); }
function goHome() { state = 'intro'; slot.innerHTML = ''; homeEl.hidden = false; setBars(); fit(); run(); }
function startScene(i) {
  if (i === 0) { results = []; deck = MISHAPS.slice().sort(() => Math.random() - .5); }
  idx = i; p = SCENES[i].setup(); time = 0; state = 'card'; shot = null;
  homeEl.hidden = true; setBars();
  const sc = SCENES[i], fg = CARD_INK[i] ? '#191919' : '#E1DBC4', size = Math.min(21, 150 / sc.title.length);
  slot.innerHTML = '<div class="card" id="card" style="background:' + sc.field + ';color:' + fg + '"><p class="n">' + (i + 1) + ' sur 3</p><h2 class="d" style="font-size:' + size.toFixed(1) + 'cqw">' + sc.title + '</h2><p class="q d">' + sc.cue + '</p>'
    + '<button class="btn" id="ready" type="button" style="background:' + fg + ';color:' + sc.field + '">' + (i === 0 ? 'C\'est parti' : 'Prêt') + '</button></div>';
  $('ready').onclick = () => { const c = $('card'); c.classList.add('out'); state = 'play'; t0 = performance.now() + (calm ? 100 : 420); setTimeout(() => c.isConnected && c.remove(), 600); fit(); run(); };

function run() { if (!running) { running = true; requestAnimationFrame(loop); } }

  shot = {kind, base, score, text, mishap: trap, e: 0, z: 0, at: performance.now(), trapAt: 0};

  slot.innerHTML = '<section class="verdict" id="verdict"><div class="vrow"><h2 class="d" id="vword">' + LABELS[kind] + '</h2><p class="vscore"><b id="vnum">' + base + '</b><span>/10</span></p></div><p class="vline" id="vline">' + (trap ? '' : text) + '</p><button class="btn' + (trap ? ' wait' : '') + '" id="next" type="button">' + (last ? 'Mon score' : 'Suivant') + '</button></section>';
  $('next').onclick = () => last ? showEnd() : startScene(idx + 1);

// Le piège se referme aussitôt : la photo se dégrade, le verdict change, la note fond.
function spring() {

/* ---------- Fin : mise au point sur le score, la chute, puis la carte de visite ---------- */
const LOGO = '<svg class="mono" viewBox="0 0 285 552" aria-label="Logo Studio ES"><rect class="fr" x="3" y="3" width="279" height="546" fill="none" stroke="currentColor" stroke-width="6" pathLength="1"/><g fill="currentColor">'
  + [[54, 54, 180, 50, 'h'], [184, 54, 50, 250, 'v'], [54, 154, 180, 50, 'h'], [54, 254, 180, 50, 'h'], [54, 254, 50, 150, 'v'], [54, 354, 180, 50, 'h'], [184, 354, 50, 150, 'v'], [54, 454, 180, 50, 'h']].map(([x, y, w, h, d], i) => '<rect class="b ' + d + '" style="--i:' + i + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>').join('') + '</g></svg>';
function showEnd() {

  slot.innerHTML = '<section class="end" id="end"><div class="count">'
    + '<div class="af" id="af"><i></i><i></i><i></i><i></i><p class="num d" id="num">00</p></div><p class="of d">sur 30</p><p class="rank d" id="rank">' + rank + '</p><button class="btn wait" id="cont" type="button">Continuer</button></div>'
    + '<div class="reveal" id="reveal"><h1 class="d">L\'instant décisif, c\'est <em>un métier.</em></h1>'
    + '<p class="body d">Ici, tu peux rejouer.<br>Le jour J, non.</p>'

    + '<div class="sign" id="sign"><p class="wink d">Tu viens de passer trois minutes sur ma carte de visite.</p>'
    + '<div class="cardwrap"><div class="bshadow"></div><div class="bcard"><div class="face back">' + LOGO + '</div><div class="face front"><div class="who"><p class="nm d">Studio ES</p><p class="role">Photographe de reportage<br>et d\'événement</p></div>' + LOGO

$('go').onclick = () => { initAudio(); startScene(0); };
stage.addEventListener('pointerdown', e => { if (state === 'play' && time > 0) { e.preventDefault(); shoot(); } });
